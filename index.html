<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Intro component with sign up form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <main>
      <h1>Learn to code by watching others</h1>
      <p>See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable. </p>
    </main>
    <div class="form-container">
      <div class="premium">
        <span class="plan">Try it free 7 days</span> then $20/mo. thereafter
      </div>
      <form action="index.html" id="form" method="POST" novalidate>
        <div class="full-field">
          <div class="field" id="first-name-field">
            <input type="text" name="first-name" id="first-name" placeholder="First name">
            <img src="./assets/images/icon-error.svg" alt="error icon">
          </div>
          <label for="first-name" class="error">First name cannot be empty</label>
        </div>
        <div class="full-field">
          <div class="field" id="last-name-field">
            <input type="text" name="last-name" id="last-name" placeholder="Last name">
            <img src="./assets/images/icon-error.svg" alt="error icon">
          </div>
          <label for="last-name" class="error">Last name cannot be empty</label>
        </div>
        <div class="full-field">
          <div class="field" id="email-field">
            <input type="email" name="email" id="email" placeholder="Email">
            <img src="./assets/images/icon-error.svg" alt="error icon">
          </div>
          <label for="email" class="error">Looks like this is not email</label>
        </div>
        <div class="full-field">
          <div class="field" id="first-name-field">
            <input type="password" name="password" id="password" placeholder="Password">
            <img src="./assets/images/icon-error.svg" alt="error icon">
          </div>
          <label for="password" class="error">Password cannot be empty</label>
        </div>
        <button type="submit" id="submit">Claim your free trial</button>
        <p>By clicking the button, you are agreeing to our <a href="#">Terms and Services</a></p>
      </form>
    </div>
  </div>
<!-- 
  Learn to code by watching others

  See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
  but understanding how developers think is invaluable. 

  Try it free 7 days then $20/mo. thereafter

  First Name 
  Last Name 
  Email Address
  Password

  Claim your free trial 

  By clicking the button, you are agreeing to our Terms and Services -->

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  <script src="./js/main.js"></script>
</body>
</html>
